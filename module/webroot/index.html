<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppKiller</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px 14px 40px; font:14px/1.55 -apple-system,"Noto Sans SC",sans-serif;
         background:#0f1115; color:#e6e8ee; }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:#8890a4; font-size:12px; margin-bottom:14px; }
  .meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { background:#1a1e26; border:1px solid #262c38; border-radius:8px;
          padding:6px 10px; font-size:12px; color:#b9c2d6; }
  .chip b { color:#e6e8ee; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:#7d8698; font-weight:500; font-size:12px;
       padding:6px 8px; border-bottom:1px solid #262c38; }
  td { padding:7px 8px; border-bottom:1px solid #191d25; }
  td.pkg { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .bar { height:5px; background:#222833; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#3b82f6,#8b5cf6); }
  .empty { color:#6b7383; padding:18px 4px; font-size:13px; }
  .warn { color:#f59e0b; }
  footer { margin-top:18px; color:#5b6373; font-size:11px; }
  button { background:#232a36; color:#dfe4ef; border:1px solid #333c4d; border-radius:8px;
           padding:7px 12px; font-size:12px; margin:0 6px 6px 0; }
</style>
</head>
<body>
  <h1>AppKiller <span style="color:#5b6373;font-weight:400;font-size:12px" id="ver"></span></h1>
  <div class="sub">冻结超过阈值的后台应用会被清理；期间回到可见状态立即重置计时</div>

  <div class="meta" id="meta"><div class="chip">读取中…</div></div>

  <table>
    <thead><tr><th>包名</th><th>进程</th><th>已冻结</th><th style="width:26%">进度</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">当前没有处于冻结状态的应用</div>

  <div style="margin-top:16px">
    <button onclick="load()">刷新</button>
    <button onclick="act('reload')">重载配置</button>
    <button onclick="act('log')">查看日志</button>
  </div>
  <pre id="logbox" style="display:none;margin-top:12px;padding:10px;background:#151922;border-radius:8px;
       font-size:11px;color:#a9b2c4;max-height:280px;overflow:auto;white-space:pre-wrap"></pre>

  <footer>appkillerd · 冻结判定读 /proc/&lt;pid&gt;/cgroup（/frozen）+ cgroup.events</footer>

<script>
function parseBody(t) {
  const i = t.indexOf("\r\n\r\n") >= 0 ? t.indexOf("\r\n\r\n") + 4 : t.indexOf("\n\n") + 2;
  return (t.includes("Content-Type") && i > 1) ? t.slice(i) : t;
}
function fetchText(url) {
  return fetch(url, { cache: "no-store" }).then(r => r.text()).then(parseBody);
}
function load() {
  fetchText("cgi-bin/api.sh?action=status").then(t => {
    let d;
    try { d = JSON.parse(t); } catch (e) { document.getElementById("meta").innerHTML =
      '<div class="chip warn">CGI 不可用，用 action.sh 查看状态</div>'; return; }
    if (d.error) { document.getElementById("meta").innerHTML =
      '<div class="chip warn">' + d.error + '</div>'; return; }
    document.getElementById("ver").textContent = "v" + (d.version || "?");
    const c = d.config || {};
    document.getElementById("meta").innerHTML = [
      ["阈值", (c.timeout_sec/60) + " 分钟"],
      ["间隔", (c.interval_ms/1000) + " 秒"],
      ["方式", c.kill_mode + " / " + c.kill_scope],
      ["模式", c.dry_run ? "观察(不杀)" : "已启用"],
      ["已运行", Math.floor((d.uptime_sec||0)/60) + " 分钟"],
      ["保护", (c.protect_count||0) + " 项"]
    ].map(([k,v]) => '<div class="chip">' + k + ' <b>' + v + '</b></div>').join("");

    const rows = d.watching || [];
    const tb = document.getElementById("rows");
    tb.innerHTML = rows.map(w => {
      const dur = w.frozen_sec || 0, rem = w.remain_sec || 0;
      const total = c.timeout_sec || 1;
      const pct = Math.max(2, Math.min(100, (dur / total) * 100));
      return '<tr><td class="pkg">' + w.pkg + (w.protected ? ' <span style="color:#7d8698">·保护</span>' : '') +
        '</td><td>' + w.total_procs + '</td><td>' + w.frozen_procs +
        '</td><td><div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span style="font-size:11px;color:#7d8698">' + Math.floor(dur/60) + '分 剩余 ' + Math.floor(rem/60) + '分</span></td></tr>';
    }).join("");
    document.getElementById("empty").style.display = rows.length ? "none" : "block";
  }).catch(() => {
    document.getElementById("meta").innerHTML = '<div class="chip warn">读取失败</div>';
  });
}
function act(a) {
  const box = document.getElementById("logbox");
  box.style.display = "block";
  box.textContent = "读取中…";
  fetchText("cgi-bin/api.sh?action=" + a).then(t => { box.textContent = t; });
}
load();
setInterval(load, 8000);
</script>
</body>
</html>
