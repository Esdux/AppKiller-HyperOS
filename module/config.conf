# ================= appkiller 配置 =================
# 改完不用重启：daemon 下一轮自动热重载，也可手动
#   sh /data/adb/modules/appkiller/action.sh reload
# 或发信号： kill -HUP $(cat /data/adb/modules/appkiller/run/appkillerd.pid)

# 总开关
ENABLE=1

# 冻结持续多久后清理（分钟，可写小数，0.5 = 30 秒）
TIMEOUT_MIN=30

# 扫描间隔（毫秒，最小 200）
INTERVAL_MS=2000

# 清理方式： sigkill | am_kill | force_stop
#   sigkill    直接 SIGKILL，最快最干净
#   am_kill    走 AMS 的 am kill，对缓存进程更"正规"
#   force_stop am force-stop，最彻底（会阻止该应用后台被拉起）
KILL_MODE=sigkill

# 清理范围： pkg = 该应用全部后台进程； frozen = 只清被冻结的那些进程
KILL_SCOPE=pkg

# 观察模式：1 = 只记日志不杀进程。首次上手建议先开 1 跑半天看日志
DRY_RUN=0

# oom_score_adj 低于此值视为可见/前台，一旦出现立刻重置计时
ACTIVE_ADJ=200

# 每轮最多清理几个应用，避免同一时刻批量杀进程造成卡顿
MAX_KILL_PER_ROUND=3

# 同一个包两次清理的最短间隔（秒），防止"杀了又被拉起"的死循环
KILL_COOLDOWN_SEC=180

# 兼容开关：检测 per-pid cgroup.events 的 frozen 位（AOSP 原生 freezer、其它 ROM）
DETECT_CGROUP_EVENTS=1

# 兼容开关：检测 SIGSTOP 式冻结（/proc/<pid>/stat 状态为 T）
DETECT_STATE_T=1

# 开机后等多少秒再启动（等 AMS 就绪）
START_DELAY_SEC=20

# 状态刷新间隔（秒）
STATE_INTERVAL_SEC=5

# 日志轮转上限（KB）
LOG_MAX_KB=512

# 每轮往日志打扫描耗时，排障用
DEBUG_LOG=0

# 保护名单文件（相对模块目录）—— 白名单：命中的包不参与清理
PROTECT_FILE=protect.list

# 黑名单文件：命中的包强制参与清理，优先级高于白名单与系统应用默认策略
BLACKLIST_FILE=blacklist.list

# 系统应用清单（由 App 用 PackageManager 生成，daemon 只读）
SYSTEM_LIST_FILE=system_apps.list

# 预装/系统应用默认策略：protect = 默认豁免（沿用 Cirno：FreezeExemptionChecker 里系统应用整体豁免）
# 想清理某个系统应用，把它写进 blacklist.list 即可（黑名单优先级最高）
SYSTEM_DEFAULT=protect

# persistent 应用清单（由 App 用 FLAG_PERSISTENT 生成）：这类应用杀不掉，默认豁免
IMMORTAL_FILE=immortal.list

# 普通应用默认策略：manage = 默认清理，protect = 默认豁免
USER_DEFAULT=manage

# 本地控制端口（只监听 127.0.0.1，供管理器 App 走 socket；0 = 关闭）
CTL_PORT=27183
